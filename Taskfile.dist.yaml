---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  SOPS_ENV: SOPS_AGE_KEY_FILE={{.ROOT_DIR}}/.env.sops-age SOPS_DECRYPTION_ORDER=age

tasks:
  default:
    desc: Show available tasks
    silent: true
    cmd: task --list

  init:
    desc: Install tools, prepare local state, verify secrets, and build the agent
    cmds:
      - mise install
      - mkdir -p .pi-data
      - chmod 700 .pi-data
      - task: secrets:check
      - task: container:build

  agent:
    desc: Start Pi with the decrypted agent environment
    cmd: AGENT_UID=$(id -u) AGENT_GID=$(id -g) docker compose run --rm agent

  shell:
    desc: Open a shell in the agent image without decrypting secrets
    cmd: AGENT_UID=$(id -u) AGENT_GID=$(id -g) docker compose run --rm --entrypoint bash agent

  container:build:
    desc: Build the Pi agent image
    cmd: AGENT_UID=$(id -u) AGENT_GID=$(id -g) docker compose build

  secrets:check:
    desc: Verify that the local age identity decrypts the committed environment
    cmd: "{{.SOPS_ENV}} sops decrypt --output-type dotenv secrets.sops.env >/dev/null"

  secrets:edit:
    desc: Edit the encrypted environment with SOPS
    cmd: "{{.SOPS_ENV}} sops edit secrets.sops.env"

  secrets:run:
    desc: Run a host command with all managed secrets in its environment
    cmd: "{{.SOPS_ENV}} sops exec-env --same-process secrets.sops.env '{{.CLI_ARGS}}'"

  memory:list:
    desc: List Markdown memory files
    cmd: fd --type f --extension md . memory

  memory:grep:
    desc: Search memory text with ripgrep
    cmd: rg --smart-case {{.CLI_ARGS}} memory

  memory:semantic:
    desc: Search memory semantically with jegrep and Jev
    cmd: "{{.SOPS_ENV}} sops exec-env secrets.sops.env 'jegrep {{.CLI_ARGS}} memory'"

  memory:pick:
    desc: Interactively choose a memory file
    cmd: fd --type f --extension md . memory | fzf --preview 'cat {}'

  check:
    desc: Validate the minimal agent environment
    cmds:
      - task: secrets:check
      - docker compose config --quiet
      - test -f .pi/settings.json
      - test -f memory/README.md
      - test ! -d src
      - test ! -d tests
      - test ! -d docs
