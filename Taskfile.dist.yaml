---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  SOPS_ENV: SOPS_AGE_KEY_FILE={{.ROOT_DIR}}/.env.sops-age SOPS_DECRYPTION_ORDER=age
  COMPOSE_ENV: AGENT_UID=$(id -u) AGENT_GID=$(id -g)

tasks:
  default:
    desc: Show available tasks
    silent: true
    cmd: task --list

  init:
    desc: Install host tools, prepare state, verify secrets, and build the sandbox
    cmds:
      - mise install
      - task: secrets:check
      - task: container:build
      - task: sandbox:start

  agent:
    desc: Start the sandbox and attach to its persistent Pi tmux session
    deps: [sandbox:start]
    cmd: docker compose exec sandbox /workspace/bin/attach-agent

  agent:status:
    desc: Show the sandbox and Pi tmux session status
    cmds:
      - docker compose ps sandbox
      - docker compose exec -T sandbox sh -c 'tmux list-sessions 2>/dev/null || echo "no Pi tmux session"'

  agent:stop:
    desc: Stop the active Pi tmux session without stopping the sandbox
    cmd: docker compose exec -T sandbox tmux kill-session -t pi

  shell:
    desc: Open an interactive shell in the running sandbox
    deps: [sandbox:start]
    cmd: docker compose exec sandbox bash

  sandbox:start:
    desc: Start the named long-running sandbox service
    cmds:
      - mkdir -p .pi-data/browser .pi-data/runs .pi-data/sessions .pi-data/worklease .tools/mise
      - chmod 700 .pi-data .pi-data/worklease .tools
      - "{{.COMPOSE_ENV}} docker compose up -d sandbox"

  sandbox:stop:
    desc: Stop the sandbox while preserving sessions and state
    cmd: docker compose stop sandbox

  sandbox:logs:
    desc: Follow scheduler and scheduled-job logs
    cmd: docker compose logs --follow sandbox

  container:build:
    desc: Build the Pi sandbox image
    cmd: "{{.COMPOSE_ENV}} docker compose build sandbox"

  scheduler:reload:
    desc: Ask Supercronic to reload jobs/crontab
    cmd: docker compose kill --signal USR2 sandbox

  job:run:
    desc: Run one reviewed prompt file immediately in a fresh Pi session
    deps: [sandbox:start]
    env:
      AGENT_PROMPT_FILE: '{{join " " .CLI_ARGS_LIST}}'
    cmd: docker compose exec -T -e AGENT_PROMPT_FILE sandbox /workspace/bin/run-agent

  tools:install:
    desc: Install agent-owned optional tools from .pi/mise.toml
    deps: [sandbox:start]
    cmd: docker compose exec -T sandbox mise install --yes

  secrets:check:
    desc: Verify that the local age identity decrypts the committed environment
    cmd: "{{.SOPS_ENV}} sops decrypt --output-type dotenv secrets.sops.env >/dev/null"

  secrets:edit:
    desc: Edit the encrypted environment with SOPS
    cmd: "{{.SOPS_ENV}} sops edit secrets.sops.env"

  secrets:run:
    desc: Run a host command with all managed secrets in its environment
    cmd: "{{.SOPS_ENV}} sops exec-env --same-process secrets.sops.env '{{.CLI_ARGS}}'"

  web:search:
    desc: Search the public web through the Brave Search API
    env:
      WEB_SEARCH_QUERY: '{{join " " .CLI_ARGS_LIST}}'
    cmd: "{{.SOPS_ENV}} sops exec-env secrets.sops.env 'bin/web-search'"

  memory:list:
    desc: List Markdown memory files
    cmd: fd --type f --extension md . memory

  memory:grep:
    desc: Search memory text with ripgrep
    env:
      MEMORY_QUERY: '{{join " " .CLI_ARGS_LIST}}'
    cmd: rg --smart-case -- "$MEMORY_QUERY" memory

  memory:semantic:
    desc: Search memory semantically with jegrep and Jev
    env:
      MEMORY_QUERY: '{{join " " .CLI_ARGS_LIST}}'
    cmd: "{{.SOPS_ENV}} sops exec-env secrets.sops.env 'jegrep \"$MEMORY_QUERY\" memory'"

  memory:pick:
    desc: Interactively choose a memory file
    cmd: fd --type f --extension md . memory | fzf --preview 'cat {}'

  check:
    desc: Validate the minimal agent environment
    cmds:
      - task: secrets:check
      - docker compose config --quiet
      - test -x bin/attach-agent
      - test -x bin/run-agent
      - test -x bin/web-search
      - test -f .pi/settings.container.json
      - test -L .pi/settings.json
      - test "$(readlink .pi/settings.json)" = /workspace/.pi/settings.container.json
      - test -f .pi/mise.toml
      - test -f jobs/crontab
      - test -f memory/README.md
      - test -f results/README.md
      - test ! -d src
      - test ! -d tests
      - test ! -d docs
