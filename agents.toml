[project]
name = "agents"
path = "."
default_branch = "main"
verify = [["task", "check"], ["task", "test"]]

[runtime]
poll_seconds = 5
stall_seconds = 1800
launch_budget_per_hour = 12
max_agents = 4
max_consultations = 3
worker_grace_seconds = 86400

[execution]
backend = "herdr"
version = "0.8.2"
# Omit session to derive agents-{project.instance_id} from initialized state.
provider = "opencode"
# Set one fixed model:
# model = "openai/gpt-5"
# effort = "high"
#
# Or choose one model/effort pair when each execution is reserved:
# models = [
#   { id = "openai/gpt-5", effort = "high" },
#   { id = "anthropic/claude-sonnet-4-6" },
# ]

[web]
host = "127.0.0.1"
port = 9890

[[actors]]
slug = "human"
kind = "human"
reports_to = ""
profile_template = ""
specialty = ""
persistent = true
capacity = 1

[[actors]]
slug = "system"
kind = "system"
reports_to = ""
profile_template = ""
specialty = ""
persistent = true
capacity = 1

[[actors]]
slug = "elder"
kind = "agent"
reports_to = "human"
profile_template = "elder"
specialty = ""
persistent = true
capacity = 1
# Optional persona-specific pool; overrides [execution] for this actor.
# models = [
#   { id = "openai/gpt-5", effort = "high" },
# ]

[[actors]]
slug = "explorer"
kind = "agent"
reports_to = "elder"
profile_template = "explorer"
specialty = "research"
persistent = true
capacity = 3

[[actors]]
slug = "yapper"
kind = "agent"
reports_to = "elder"
profile_template = "yapper"
specialty = "publishing"
persistent = true
capacity = 3
