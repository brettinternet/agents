[project]
name = "agents"
path = "."
default_branch = "main"
verify = [["task", "check"], ["task", "test"]]

[runtime]
poll_seconds = 5
stall_seconds = 7200
launch_budget_per_hour = 24
max_agents = 8
max_consultations = 6
worker_grace_seconds = 86400

[execution]
backend = "herdr"
version = "0.8.2"
isolation = "host"
# Omit session to derive agents-{project.instance_id} from initialized state.
provider = "opencode"
# Set one fixed model:
# model = "openai/gpt-5"
# effort = "high"
#
# Or choose one model/effort pair when each execution is reserved:
# models = [
#   { id = "openai/gpt-5", effort = "high" },
#   { id = "anthropic/claude-sonnet-4-6" },
# ]

[execution.container]
colima_profile = "agents"
image = "agents-agent-opencode:local"
cpus = 2.0
memory_mb = 4096
pids_limit = 512
gc_interval_seconds = 3600
gc_grace_seconds = 3600
build_cache_retention_hours = 168

[web]
host = "127.0.0.1"
port = 9890

[[actors]]
slug = "human"
kind = "human"
reports_to = ""
profile_template = ""
specialty = ""
persistent = true
capacity = 1

[[actors]]
slug = "system"
kind = "system"
reports_to = ""
profile_template = ""
specialty = ""
persistent = true
capacity = 1

[[actors]]
slug = "manager"
kind = "agent"
reports_to = "human"
profile_template = "manager"
specialty = ""
persistent = true
capacity = 1
# Optional persona-specific pool; overrides [execution] for this actor.
# models = [
#   { id = "openai/gpt-5", effort = "high" },
# ]

[[actors]]
slug = "researcher"
kind = "agent"
reports_to = "manager"
profile_template = "researcher"
specialty = "research"
persistent = true
capacity = 3

[[actors]]
slug = "executor"
kind = "agent"
reports_to = "manager"
profile_template = "executor"
specialty = "implementation"
persistent = true
capacity = 3

[[actors]]
slug = "writer"
kind = "agent"
reports_to = "manager"
profile_template = "writer"
specialty = "publishing"
persistent = true
capacity = 3

[[schedules]]
slug = "manager-garden-round"
every = "2h"
to = "@manager"
message = """
Review recent findings, conversations, backlog state, and observed friction.
Choose at most one worthwhile action:

1. Start a bounded reversible experiment or conversation.
2. Create and refine one tracked spike or task when a durable outcome is justified.
3. Propose one evidence-backed agents.toml or agents/*.md improvement through tracked implementation work.
4. Report `nothing worth doing`.

Prefer a conversation or reversible experiment over tracked work. Before acting, state the objective, boundaries, stopping condition, and output destination. Base later tuning proposals on useful artifacts, abandoned or duplicate work, queue growth, and required human intervention.

Do not manufacture work to satisfy the round. Do not weaken safety, authorization, review, verification, or human approval.
"""
overlap = "skip"

[[schedules]]
slug = "manager-autonomy-review"
every = "14d"
to = "@manager"
message = """
Review the autonomy experiment since the prior review using useful artifacts, abandoned or duplicate work, queue growth, and required human intervention. Propose at most one evidence-backed agents.toml or agents/*.md adjustment through tracked implementation work, or report `no change needed`. Preserve safety, authorization, review, verification, and human approval.
"""
overlap = "skip"

[[schedules]]
slug = "researcher-curiosity-wander"
every = "8h"
to = "@researcher"
message = "Wander one public web, repository, or memory thread with curiosity; make at most one bounded, reversible, public-safe experiment or artifact, share what you learn, and say `nothing worth doing` if no worthwhile thread appears."
overlap = "skip"

[[schedules]]
slug = "writer-editorial-round"
every = "12h"
to = "@writer"
message = "Review current publishing requests and take one bounded writing assignment. Produce clear, well-structured copy from supplied evidence; return the draft to manager unless the account and venue are explicitly authorized, and say `nothing worth doing` if no request is ready."
overlap = "skip"
