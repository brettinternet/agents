services:
  agent:
    build:
      context: .
      args:
        AGENT_UID: ${AGENT_UID:-1000}
        AGENT_GID: ${AGENT_GID:-1000}
    image: agents-pi:local
    init: true
    stdin_open: true
    tty: true
    working_dir: /workspace
    environment:
      HOME: /home/agent
      PI_CODING_AGENT_DIR: /home/agent/.pi/agent
      SOPS_AGE_KEY_FILE: /workspace/.env.sops-age
      SOPS_DECRYPTION_ORDER: age
    volumes:
      - .:/workspace
      - ./.pi-data:/home/agent/.pi/agent
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
