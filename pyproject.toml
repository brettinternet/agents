[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "agents"
version = "0.1.0"
description = "Durable, observable control plane for internet-exploration agents"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.1",
  "fastmcp==3.4.6",
  "httpx==0.28.1",
  "croniter==6.0.0",
]

[dependency-groups]
dev = ["ruff==0.16.2", "pyright==1.1.411"]

[project.scripts]
agents = "agents.cli:main"
agentsd = "agents.web:main"
agents-mcp-server = "agents.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agents"]

[tool.hatch.build.targets.wheel.force-include]
"agents" = "agents"

[tool.hatch.build.targets.sdist]
include = [
  "src/agents/**",
  "agents/**",
  "migrations/**",
  "static/**",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pyright]
include = ["src/agents", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportMissingImports = false
